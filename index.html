<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Peter's Pizzeria</title>
    <meta name="description" content="A student-run pizzeria. 72-hour fermented dough, fired every Saturday at 7pm until sellout. Medford/Somerville, MA." />
    <meta name="theme-color" content="#1a1208" />
    <meta property="og:title" content="Peter's Pizzeria" />
    <meta property="og:description" content="Student-run pizzeria at Tufts. 72-hour dough, fired every Saturday at 7pm until sellout." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://peters-pizzeria-site.vercel.app/" />
    <meta property="og:image" content="https://peters-pizzeria-site.vercel.app/photos/static/pizza-ooni.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/photos/static/pizza-ooni.jpg" />
    <!-- Fonts are self-hosted (see the @font-face block at the top of
         src/index.css). The two preloads below are the faces used above the
         fold on every page — the roman Fraunces that sets the headlines and
         the Inter that sets the nav. Preloading them starts the download
         alongside the stylesheet instead of after it, which is the whole point:
         the browser otherwise cannot know it needs a font until the CSS that
         references it has parsed.

         Only the latin subsets are preloaded. The -ext files are declared with
         a unicode-range and stay unfetched unless the page actually renders a
         character in that range, so preloading them would be a guaranteed
         wasted download on nearly every visit. Italic is not preloaded either
         — it is used, but never in the first paint.

         crossorigin is required on a font preload even same-origin: fonts are
         fetched in CORS mode, and without it the browser downloads the file
         twice rather than reusing the preloaded copy. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
