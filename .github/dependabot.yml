# Dependabot — opens PRs to keep dependencies current. Every PR it raises runs
# the Tests workflow (npm ci → npm test → npm run build) and React Doctor, so a
# bump that breaks the build or the suite shows up red before it can be merged.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# One thing to know before merging an npm PR here: package.json carries a large
# `overrides` block pinning transitive packages up out of known-vulnerable
# ranges (undici, tar, esbuild, path-to-regexp, …). Dependabot does not read or
# maintain that block — it bumps direct dependencies only. So when it raises a
# major bump for a package that owns pinned transitives (`vercel` and the
# `@vercel/*` builders especially), check whether the matching override is now
# stale: an override pinning a version *below* what the new release ships would
# silently downgrade it. `npm ls <package>` after checking the branch out shows
# what actually resolved.
version: 2

updates:
  # ---------------------------------------------------------------- npm ----
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    # Wait a week before proposing a newly published version. Nearly every
    # recent npm supply-chain compromise (the chalk/debug and nx incidents,
    # eslint-config-prettier) was a hijacked maintainer account publishing a
    # malicious patch that was pulled within hours-to-days of being caught. A
    # cooldown means the weekly PR simply never contains those versions, which
    # matters here specifically because these PRs are grouped and routine, and
    # a patch bump is the update least likely to get read line by line.
    cooldown:
      default-days: 7
    # Small project, one maintainer: a handful of PRs at a time is the point at
    # which review still happens. Grouping below keeps this well under the cap
    # in a normal week.
    open-pull-requests-limit: 5
    # No `include: scope` — the prefixes below already carry the scope, and
    # setting both produced titles reading "chore(deps-dev)(deps-dev): …".
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Order matters: a dependency joins the FIRST group whose rules it matches,
    # so the peer-locked pairs have to be declared above the catch-all
    # minor/patch groups or they'd be swallowed by them.
    groups:
      # These two pairs are locked together by peer ranges and are uninstallable
      # if they move apart — `npm ci` fails with ERESOLVE before a single test
      # runs. Both were learned the hard way on the first Dependabot run:
      #   react 19 alone   → react-dom@18.3.1 peers on react@^18.3.1 (PR #9)
      #   vite 8 alone     → @vitejs/plugin-react@4 peers on vite ^4|^5|^6|^7,
      #                      and vite 8 needs plugin-react >=5.2.0 (PR #8)
      # No `update-types` filter on either — the whole point is that majors
      # travel together, which is exactly what the split PRs got wrong.
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
      vite:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
      # Minor and patch bumps ride together — one PR to review, one CI run.
      # Runtime and tooling stay in separate groups because the blast radius is
      # different: a bad runtime bump ships to customers placing orders, a bad
      # dev bump only breaks the build in front of us.
      runtime-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
      tooling-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      # Advisories tend to arrive in clusters that share a transitive root;
      # one PR per cluster beats five PRs that each fix a slice of it.
      security:
        applies-to: security-updates
        patterns: ["*"]
    # Majors outside the pairs above are deliberately ungrouped — each one gets
    # its own PR with its own changelog to read.
    ignore:
      # `vercel` is the local dev-API/CLI shim, not something the deployed site
      # imports, and it releases several times a week — a weekly major/minor PR
      # for it is pure noise. Patches still come through, and `vercel@latest`
      # is a one-line manual bump whenever it's actually wanted.
      - dependency-name: vercel
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Tailwind 4 is a migration, not a bump, and Dependabot can't do it: the
      # PostCSS plugin moved to its own package (`@tailwindcss/postcss`), the
      # `@tailwind base/components/utilities` directives in src/index.css become
      # a single `@import "tailwindcss"`, and theme config moves into CSS. The
      # v4 PR failed the build on exactly that (PR #10) and would have been
      # reopened every Monday to fail the same way. Minors and patches on the
      # 3.x line still come through. Drop these two lines when someone actually
      # wants to sit down and do the migration.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  # ----------------------------------------------------- github actions ----
  # Keeps the `uses:` pins in .github/workflows current (actions/checkout,
  # actions/setup-node, millionco/react-doctor). These drift quietly — a
  # deprecated runner version fails the workflow with nothing in the diff to
  # explain it. Majors are grouped in here rather than split out: a bad action
  # bump can only break CI, and it breaks it visibly on the PR that makes it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    # Same reasoning as the npm block above. Actions are pinned to commit SHAs
    # (a tag can be silently repointed at new code; a SHA cannot), and
    # Dependabot bumps both the SHA and its trailing version comment — so this
    # ecosystem is what keeps those pins from going stale.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
    labels:
      - dependencies
